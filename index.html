<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closer Search · Cómo trabajamos</title>
<meta property="og:title" content="Closer Search · Cómo trabajamos">
<meta property="og:description" content="Equipos de setters y closers para vender soluciones de IA a empresas.">
<style>
  :root { --bg:#000; --gold:#c9a24b; --text:#f2f2f2; --muted:#9a9a9a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; text-align:left; }
  .wrap { width:100%; max-width:960px; }
  h1 { font-size:clamp(22px, 4vw, 32px); font-weight:600; margin-bottom:6px; }
  h1 span { color:var(--gold); }
  p { color:var(--muted); font-size:15px; margin-bottom:20px; }
  hr { border:0; height:1px; background:var(--gold); width:60px; margin:0 0 20px; }
  video { width:100%; border-radius:10px; background:#111; display:block; }
  .cta { margin-top:22px; font-size:15px; color:var(--muted); }
  .cta a { color:var(--gold); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Closer <span>Search</span></h1>
    <hr>
    <p>Así trabajamos: seleccionamos, formamos y dirigimos equipos de setters y closers.</p>
    <video src="closer-search.mp4" controls playsinline preload="metadata"></video>
    <div class="cta">Más información en <a href="https://www.closersearch.com/empresas-ia">www.closersearch.com</a></div>
  </div>
</body>
</html>
